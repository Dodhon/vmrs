name: Chore / tech debt
description: Maintenance work that improves the codebase
title: "[chore] <short summary>"
labels: ["triage", "type:chore"]
body:
  - type: textarea
    id: work
    attributes:
      label: Work to do
      placeholder: "Describe the maintenance task"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why now?
      description: Risk reduction, speed, correctness, etc.
      placeholder: "Motivation"
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
