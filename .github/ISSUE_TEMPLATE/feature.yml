name: Feature request
description: Propose a change or new capability
title: "[feature] <short summary>"
labels: ["triage", "type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user need
      description: What user problem are we solving and for whom?
      placeholder: "As a ..., I want ..., so that ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should we build? Keep it minimal.
      placeholder: "Describe the smallest viable approach"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What are we explicitly not doing?
      placeholder: "- ..."
    validations:
      required: false
