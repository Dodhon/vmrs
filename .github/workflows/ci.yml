name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Minimal + deterministic: tests we run here are stdlib-only (hitl_schema).
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Check HITL schema excerpt is up to date
        run: |
          python -m src.hitl_schema --check-excerpt "interface prompts/hitl_schema_excerpt.txt"

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q
